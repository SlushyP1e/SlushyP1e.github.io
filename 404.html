<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | SlushyPie</title>
    <meta name="robots" content="noindex" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#121212" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />

    <style>
      :root {
        --bg: #121212;
        --panel: #1a1a1a;
        --border: #2b2b2b;
        --text: #ededed;
        --text-dim: #9e9e9e;
        --rose: #e7b7c7;
        --rose-text: #dda9bb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--text);
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        line-height: 1.55; padding: 24px;
      }
      .card {
        text-align: center; max-width: 460px; width: 100%;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 24px; padding: 52px 32px;
      }
      .code {
        color: var(--rose-text); font-weight: 800; letter-spacing: 0.15em;
        text-transform: uppercase; font-size: 0.78rem;
      }
      h1 {
        font-size: clamp(3rem, 12vw, 4.5rem); line-height: 1;
        font-weight: 800; letter-spacing: -0.02em; margin: 14px 0 10px;
      }
      h1 span { color: var(--rose); }
      p { color: var(--text-dim); margin: 0 0 28px; }
      .btn {
        display: inline-flex; align-items: center; gap: 10px;
        height: 52px; padding: 0 26px; border-radius: 13px;
        background: var(--rose); color: #1c1c1c;
        font-weight: 800; font-size: 1rem; text-decoration: none;
        transition: transform .15s ease, filter .2s ease;
      }
      .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    </style>
  </head>

  <body>
    <div class="card">
      <span class="code">Error</span>
      <h1>4<span>0</span>4</h1>
      <p>this page melted like a slushy left out in the aussie sun ^~^</p>
      <a class="btn" href="/">Back to home</a>
    </div>
  </body>
</html>
