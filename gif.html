<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIF Gallery | SlushyPie</title>
    <meta name="description" content="SlushyPie's collection of GIFs." />

    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://slushypie.com/gif.html" />
    <meta property="og:url" content="https://slushypie.com/gif.html" />
    <meta property="og:title" content="GIF Gallery | SlushyPie" />
    <meta property="og:description" content="SlushyPie's collection of GIFs." />
    <meta property="og:image" content="https://slushypie.com/SlushyPies.png" />
    <meta property="og:image:alt" content="SlushyPie" />
    <meta property="og:site_name" content="SlushyPie" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://slushypie.com/SlushyPies.png" />

    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" />

    <link rel="stylesheet" href="theme.css" />
    <script src="site.js" defer></script>
  </head>

  <body>
    <div class="page">
      <header class="top">
        <a href="./"><img class="wordmark" src="wordmark.webp" alt="SlushyPie" width="367" height="76" /></a>
        <nav aria-label="Main"><a href="./">← back home</a></nav>
      </header>

      <main>
        <div class="page-head">
          <h1><span class="drawn">GIF Gallery</span></h1>
          <p>My collection of gifs. Click to view and/or copy.</p>
        </div>
        <div id="gif-wall" class="gif-wall"></div>
      </main>

      <footer class="foot">
        <span>&copy; <span class="year">2026</span> SlushyPie <span class="heart">♡</span> made with love</span>
      </footer>
    </div>

    <dialog id="lightbox" class="lightbox" aria-label="GIF preview">
      <img id="lightbox-img" src="data:," alt="" />
      <form method="dialog"><button class="btn ink">close</button></form>
    </dialog>

    <script>
      // Add new gifs here: drop the file in /gif and list it below with its pixel size
      // (the size stops the page jumping around while gifs load).
      const GIFS = [
        { file: 'slushypie-vrchat.gif', w: 281, h: 498 },
        { file: 'slushypie-eat.gif', w: 253, h: 450 },
        { file: 'SlushyPieMyBeloved.gif', w: 400, h: 300 },
        { file: 'chompy.gif', w: 380, h: 705 },
        { file: 'dap.gif', w: 498, h: 411 },
      ];

      const wall = document.getElementById('gif-wall');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');

      GIFS.forEach(({ file, w, h }) => {
        const url = new URL(`gif/${file}`, location.href).href;
        const label = file.replace(/\.gif$/i, '');
        const card = document.createElement('figure');
        card.className = 'polaroid tape';
        card.innerHTML = `
          <button type="button" class="gif-view" aria-label="View ${label} larger">
            <img src="gif/${file}" alt="${label}" width="${w}" height="${h}" loading="lazy" />
          </button>
          <figcaption>${label}</figcaption>
          <button type="button" class="copy-link" data-copy="${url}" data-toast="link copied ♡" aria-label="Copy link to ${label}">copy link</button>`;
        card.querySelector('.gif-view').addEventListener('click', () => {
          lightboxImg.src = `gif/${file}`;
          lightboxImg.alt = label;
          lightbox.showModal();
        });
        wall.append(card);
      });

      // Clicking the backdrop closes too (the backdrop counts as the dialog itself)
      lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.close(); });
    </script>
  </body>
</html>
